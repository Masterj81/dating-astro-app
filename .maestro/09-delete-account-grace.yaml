# 09 - Delete account with 7-day grace window.
#
# WARNING: this flow TRIGGERS A REAL SOFT DELETE on Supabase. The test
# account it targets MUST be dedicated to destructive flows. Use
# TEST_DELETABLE_EMAIL / TEST_DELETABLE_PASSWORD from config.yaml --
# DO NOT repoint this at TEST_USER_EMAIL, that account is used by
# other flows.
#
# The edge function `delete-account` requires a "recent auth" gate
# (<5 min since last sign-in). Because we log in fresh inside this
# flow, the gate passes. On success, Supabase returns
# { grace_window_days: 7 } and the app shows an alert with the
# accountDeletionScheduled translation, then signs out and routes to
# login. We assert on the "7 days" or i18n key substring.

appId: com.astrodatingapp.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

# Login using the deletable account specifically.
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_DELETABLE_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_DELETABLE_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "discover-like-button"
    timeout: 20000

# Open settings via deep link (same approach as flow 02).
- openLink: "astrodating://settings"

- extendedWaitUntil:
    visible:
      id: "settings-delete-account"
    timeout: 10000
- tapOn:
    id: "settings-delete-account"

# First alert -- "Are you sure?" / "Delete account" warning.
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000
- tapOn: "Delete"

# Second alert -- final confirmation.
- extendedWaitUntil:
    visible: "Yes, delete"
    timeout: 5000
- tapOn: "Yes, delete"

# Success alert. The message mentions the grace window -- assert on
# "7 days" (English default) or the i18n substring.
- extendedWaitUntil:
    visible: "7 days"
    timeout: 20000
- tapOn: "OK"

# App signs out and routes to login.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
