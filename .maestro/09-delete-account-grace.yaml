# 09 - Delete account row reachability smoke test.
#
# SAFETY-FIRST: this flow does NOT tap the delete-account row at all.
# It only verifies the row exists in the settings screen and is reachable
# (scrollable into view). Tapping the row would open the destructive
# Alert.alert -- and the user has already been bitten by a prior version
# of this flow that DID tap it and ended up triggering a real soft-delete
# (which the daily process-expired-deletions cron then hard-deleted).
#
# Full delete confirmation flow (alert title -> destructive button -> grace
# window confirmation) is on the P3 backlog and requires a custom modal
# with testIDs to be safely automated.
#
# Prereq: any logged-in account works -- the row's visibility doesn't depend
# on user identity. We use TEST_USER_EMAIL by default.

appId: com.astrodatingapp.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/login-as-test-user.yaml

# Open settings via deep link, then scroll until the delete row is visible.
- openLink: "astrodating://settings"

- scrollUntilVisible:
    element:
      id: "settings-delete-account"
    direction: DOWN
    timeout: 15000
    speed: 40

# DO NOT tap the row. We only assert it exists and is reachable.
- assertVisible:
    id: "settings-delete-account"
