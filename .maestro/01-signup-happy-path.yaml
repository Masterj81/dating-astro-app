# 01 - Signup smoke test (Android).
#
# Verifies: signup screen loads, form fields are tappable + receive input,
# submit triggers signup, app advances to the next gated step.
#
# STAGING BEHAVIOUR: Supabase staging has email confirmation enabled, so
# after a successful signup the app routes to /auth/verify-email rather
# than to onboarding. We assert on that screen as the success anchor.
# Disabling email confirmation in the staging Auth dashboard would let
# the flow continue into onboarding, but that requires Picker testIDs to
# drive the birth-date wizard (P3 backlog).

appId: com.astrodatingapp.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

# Wait for the login screen to settle, then jump straight to signup via
# deep link. The login-signup-link tap goes through an expo-router <Link
# asChild> wrapper which Maestro could not always trigger reliably.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 20000
- openLink: "astrodating://auth/signup"

# Step 1 -- account basics.
- extendedWaitUntil:
    visible:
      id: "signup-name-input"
    timeout: 15000
# `clearState: true` ensures fields start empty -- no eraseText needed.
- tapOn:
    id: "signup-name-input"
- inputText: "Maestro Test"
- hideKeyboard
- tapOn:
    id: "signup-email-input"
- inputText: "maestro+${maestroRunId}@astrodatingapp.test"
- hideKeyboard
- tapOn:
    id: "signup-password-input"
- inputText: "MaestroTest!123"
- hideKeyboard
- tapOn:
    id: "signup-submit-button"

# After submit, staging routes to /auth/verify-email. Asserting the screen
# testID is locale-stable (the title text is i18n).
- extendedWaitUntil:
    visible:
      id: "verify-email-screen"
    timeout: 30000
- assertVisible:
    id: "verify-email-title"
