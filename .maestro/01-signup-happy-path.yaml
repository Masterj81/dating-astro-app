# 01 - Signup happy path (Android).
#
# Clear state, walk through signup + 3-step onboarding wizard, arrive on
# Discover. Uses a time-stamped fake email so the flow is re-runnable
# without collisions.
#
# Prereq: the Supabase staging project must allow signup without email
# confirmation (or the email verify flow is automated on staging). If
# email confirmation is enforced, flow stops at the verify-email screen
# and that is an expected partial state -- see docs/E2E.md.

appId: com.astrodatingapp.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

# From login screen, open signup.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 20000
- tapOn:
    id: "login-signup-link"

# Step 1 -- account basics.
- extendedWaitUntil:
    visible:
      id: "signup-name-input"
    timeout: 15000
- tapOn:
    id: "signup-name-input"
- inputText: "Maestro Test"
- hideKeyboard
- tapOn:
    id: "signup-email-input"
- inputText: "maestro+${randomNumber}@astrodatingapp.test"
- hideKeyboard
- tapOn:
    id: "signup-password-input"
- inputText: "MaestroTest!123"
- hideKeyboard
- tapOn:
    id: "signup-submit-button"

# Onboarding step 1 (birthday). If staging requires email verification
# before reaching onboarding, Maestro will fail here -- see docs.
- extendedWaitUntil:
    visible:
      id: "onboarding-step1-continue"
    timeout: 25000
# The birth-date pickers are native pickers (month/day/year). Maestro
# can only drive them via visual taps so we rely on step wizard's
# default values (placeholders are empty) -- select values manually.
# On Android, tap each wheel, then tap the visible option.
- tapOn: "Month"
- tapOn: "March"
- tapOn: "Day"
- tapOn: "15"
- tapOn: "Year"
- tapOn: "1995"
- tapOn:
    id: "onboarding-step1-continue"

# Onboarding step 2 (time + city). We skip time and enter a city.
- extendedWaitUntil:
    visible:
      id: "onboarding-birth-city-input"
    timeout: 10000
- tapOn:
    id: "onboarding-birth-city-input"
- inputText: "Paris, France"
- hideKeyboard
- tapOn:
    id: "onboarding-step2-continue"

# Onboarding step 3 (gender + preference) -- tap first gender option and
# leave "everyone" as the default showMe.
- extendedWaitUntil:
    visible: "Female"
    timeout: 10000
- tapOn: "Female"
- tapOn:
    id: "onboarding-submit-button"

# After submit, the chart reveal overlay appears -- tap "Let's Find Your Matches".
- extendedWaitUntil:
    visible: "Let's Find Your Matches"
    timeout: 30000
- tapOn: "Let's Find Your Matches"

# Land on Discover. The like button is the canonical anchor.
- extendedWaitUntil:
    visible:
      id: "discover-like-button"
    timeout: 15000
- assertVisible:
    id: "discover-like-button"
