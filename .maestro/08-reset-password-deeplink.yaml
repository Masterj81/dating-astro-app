# 08 - Reset-password deep link opens the recovery screen.
#
# Background: the web auth-callback handles the real Supabase recovery
# token (token_hash / code) and routes the user to the mobile via a
# custom-scheme deep link. The mobile _layout.tsx validates the URL
# against an allowlist (see commit 81315d1, P1-7) and then Supabase's
# onAuthStateChange emits PASSWORD_RECOVERY which triggers
# router.replace('/auth/reset-password').
#
# We can't feed a real signed recovery token from a YAML file, so this
# flow exercises ONLY the deep-link -> screen navigation half: sending
# a recovery URL on the allowlisted scheme should land on the reset
# screen. A full end-to-end would require plumbing in a dummy recovery
# token from Supabase admin API -- deferred to a later iteration.
#
# If Supabase session is not attached, the reset-password screen will
# block the update with an alert. That is EXPECTED here -- we only
# assert the screen itself is visible.

appId: com.astrodatingapp.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

# Wait for the app to settle on the login screen.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

# Fire the custom-scheme link. The _layout.tsx URL validator accepts
# the 'astrodating:' scheme and recognises `type=recovery`.
- openLink: "astrodating://auth/reset-password?type=recovery"

# The reset screen has the new-password input and the submit button.
# NOTE: without a real session this screen may flash and redirect back
# -- we wait up to 8s and then check either the input OR that we are
# no longer on the login email input (proof the deep link was handled).
- extendedWaitUntil:
    visible:
      id: "reset-password-new-input"
    timeout: 10000
- assertVisible:
    id: "reset-password-new-input"
- assertVisible:
    id: "reset-password-submit-button"
