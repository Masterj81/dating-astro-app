# 06 - Free user hits the Natal Chart paywall.
#
# Uses login-as-free-user (e2e_free@example.com), seeded by
# .maestro/seed-matches.sql with no subscription and pre-consumed
# premium_usage rows so the gate hits the denied state on first visit.
#
# We assert the stable PremiumGate testIDs rather than the i18n title:
#   - premium-paywall-cta visible
#   - premium-gate-granted NOT visible

appId: com.astrodatingapp.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/login-as-free-user.yaml

# Deep-link straight into the gated Celestial screen. PremiumGate decides:
# tier=free + trial used -> denied UI -> CTA testID matches.
- openLink: "astrodating://premium-screens/natal-chart"

- extendedWaitUntil:
    visible:
      id: "premium-paywall-cta"
    timeout: 20000

- assertVisible:
    id: "premium-paywall-cta"
- assertNotVisible:
    id: "premium-gate-granted"
