# 04 - Send a message in an existing chat.
#
# Requires that TEST_USER has at least one existing match so the Matches
# tab has a conversation to open. See docs/E2E.md for seeding.
#
# Strategy: tap the chat-button (testID="match-chat-button") on the first
# MatchCard. The card itself is `match-card` and opens the profile, so we
# must hit the dedicated chat affordance (the speech-bubble icon).

appId: com.astrodatingapp.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/login-as-test-user.yaml

# Jump to the matches tab via deep link -- bottom-tab labels are localised
# so a textual tap is fragile across staging users.
- openLink: "astrodating://(tabs)/matches"

# Wait for either at least one match card OR the empty state. If we land on
# empty state the test cannot proceed -- treat as expected partial.
- extendedWaitUntil:
    visible:
      id: "match-card"
    timeout: 15000

- tapOn:
    id: "match-chat-button"
    index: 0

# We're on the chat screen.
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000

- tapOn:
    id: "chat-input"
- inputText: "E2E test message"
# Close the keyboard before tapping send -- the Android soft keyboard can
# cover the send button and Maestro's element matcher then reports "not
# found" even though the node exists in the hierarchy.
- hideKeyboard
- tapOn:
    id: "chat-send-button"

# After send, the optimistic bubble renders; the realtime subscription
# swaps it for the server row within ~1-2s. Assert the "sent" bubble
# is visible (non-pending).
- extendedWaitUntil:
    visible:
      id: "chat-message-sent"
    timeout: 15000
- assertVisible: "E2E test message"
- assertNotVisible:
    id: "chat-message-pending"
- assertNotVisible:
    id: "chat-message-failed"
