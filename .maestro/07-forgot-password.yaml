# 07 - Forgot password (mobile).
#
# Mobile has a dedicated forgot-password screen; it sends a reset email
# via supabase.auth.resetPasswordForEmail and then navigates to the
# "password-reset-sent" confirmation screen. We assert on the
# confirmation screen rather than trying to read the outgoing email.

appId: com.astrodatingapp.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- tapOn:
    id: "login-forgot-password-link"

- extendedWaitUntil:
    visible:
      id: "forgot-password-email-input"
    timeout: 10000
- tapOn:
    id: "forgot-password-email-input"
- inputText: ${TEST_USER_EMAIL}
- hideKeyboard
- tapOn:
    id: "forgot-password-submit-button"

# After a successful call, the app navigates to /auth/password-reset-sent.
# Assert on the screen testID rather than the localised "Check your email"
# copy -- the title is i18n and varies per TEST_USER locale.
- extendedWaitUntil:
    visible:
      id: "password-reset-sent-screen"
    timeout: 15000
- assertVisible:
    id: "password-reset-sent-title"
