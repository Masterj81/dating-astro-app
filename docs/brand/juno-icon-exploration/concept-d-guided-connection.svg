<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>JUNO — Concept D — Guided Connection</title>
  <defs>
    <linearGradient id="dTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11141b"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="dArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9c873"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
  </defs>

  <!-- app-icon tile -->
  <rect width="1024" height="1024" rx="224" fill="url(#dTile)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="221" fill="none" stroke="#e9c873" stroke-opacity="0.10" stroke-width="6"/>

  <!-- Two points joined by a soft, deliberate arc — an intentional path, not a dating arrow.
       The arc is a gentle, complete curve: a journey met. -->
  <g transform="translate(512 512)">
    <!-- faint orbital field for context -->
    <circle r="320" fill="none" stroke="#e7e9ee" stroke-width="4" stroke-opacity="0.10"/>

    <!-- the guided path: a calm S-less single sweeping arc between the two anchors -->
    <path d="M -238 168 C -120 -200, 120 -200, 238 168"
          fill="none" stroke="url(#dArc)" stroke-width="34" stroke-linecap="round"/>

    <!-- a small waypoint at the apex = the meeting point, considered -->
    <circle cx="0" cy="-126" r="26" fill="#e7e9ee"/>
    <circle cx="0" cy="-126" r="48" fill="none" stroke="#e7e9ee" stroke-width="5" stroke-opacity="0.45"/>

    <!-- the two people as grounded points -->
    <circle cx="-238" cy="168" r="56" fill="#e9c873"/>
    <circle cx="-238" cy="168" r="80" fill="none" stroke="#e9c873" stroke-width="6" stroke-opacity="0.4"/>
    <circle cx="238" cy="168" r="56" fill="#7aa7ff"/>
    <circle cx="238" cy="168" r="80" fill="none" stroke="#7aa7ff" stroke-width="6" stroke-opacity="0.4"/>
  </g>
</svg>
