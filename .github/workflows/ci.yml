name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# JUNO-18 of docs/security-audit-2026-09-07.md.
#
# Without this block GITHUB_TOKEN inherits the repository default, which for a
# repository created before Feb 2023 — this one — is read/write on contents,
# packages, issues, pull requests and more. Every step, including anything a
# third-party action decides to run, gets that token in its environment. This
# pipeline pushes nothing, comments nothing and publishes nothing: it installs
# dependencies and runs validators. Read is all it has ever needed.
#
# Workflow level rather than job level so a job added later inherits the
# restriction instead of silently starting from the repository default. A job
# that genuinely needs more must declare its own `permissions:` block AND say
# why — scripts/validate-repo-hygiene.mjs fails the build on an escalation with
# no justification comment.
#
# `pull_request` (not `pull_request_target`) is what makes fork PRs safe here:
# GitHub withholds repository secrets from fork runs of `pull_request`, and the
# token it does issue is read-only regardless. This workflow reads no secret at
# all, so there is nothing to withhold.
permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.18+ is a hard requirement, not a preference:
          # scripts/validate-email-templates.mjs imports the edge-function
          # templates as TypeScript and asserts on the rendered output.
          # Native type stripping is on by default from 22.18 and absent
          # entirely on 20, where the run dies with "Unknown file extension".
          #
          # 24 also matches the machine this is developed on. CI was pinned to
          # 20 — past end-of-life — so it had been validating under a runtime
          # nobody actually runs.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate locales
        run: npm run validate:locales

      - name: Validate premium gating contract
        run: npm run validate:premium-gating

      # ── First remediation wave, 7 Sep 2026 ────────────────────────────────
      # docs/security-audit-2026-09-07.md. Each of these guards a finding whose
      # fix is one line to undo and silent when broken.

      # The synastry engine the server runs is GENERATED from the shared one.
      # This regenerates it and fails if the committed artefact is stale — so
      # the server and the clients cannot score the same two charts differently,
      # and nobody has to remember to rebuild it.
      - name: Validate edge astrology bundle is current
        run: npm run validate:edge-astrology

      # JUNO-01/02/03/11, and JUNO-21 since 8 Sep. Executes the REAL
      # edge-function source: the payload allowlist, the authorization decision
      # and its fail-closed branches, the origin allowlist, the server-derived
      # Stripe discount, and both generations of unsubscribe token — including a
      # verbatim copy of the pre-fix signer, so "links already in an inbox still
      # work" is a test rather than a hope.
      # `packages/shared` is the only workspace with a test runner, which is why
      # suites about Deno code live there.
      - name: Validate edge security contracts
        run: npm run validate:edge-security

      # JUNO-01 specifically: reproduces the inversion that made a published
      # ecliptic longitude equal to the target's exact birth instant and
      # coordinates, then proves the payload no longer carries what it needs.
      - name: Validate published chart payload
        run: npm run validate:chart-privacy

      # JUNO-08 and the read-only surfaces. Reads the repository, so it cannot
      # see a privilege changed by hand in the SQL editor — it prints the query
      # that settles that, which is the honest scope for a code-side guard.
      - name: Validate RLS contract
        run: npm run validate:rls-contract

      # JUNO-15: local migration-history invariants (canonical names, no dupes,
      # privilege migrations self-verify, cron migrations fail closed). CI
      # cannot reach the production history — that comparison is the operator
      # tool scripts/compare-migration-history.mjs, documented in
      # docs/runbooks/migration-reconciliation-2026-09.md.
      - name: Validate migration history invariants
        run: npm run validate:migration-history

      # ── Second remediation wave, 8 Sep 2026 ───────────────────────────────
      # JUNO-18, JUNO-20 and the JUNO-21 decoupling. Structural, not
      # behavioural: it guards this workflow's own `permissions:` block, keeps
      # archives out of the route folders, and fails if an unsubscribe signing
      # key is ever derived from SUPABASE_SERVICE_ROLE_KEY again. That last one
      # is silent when broken — lifecycle mail keeps sending, and the damage
      # only appears months later when the key is rotated and every link in
      # every inbox dies at once.
      #
      # It also scans tracked files for credential material. Not a replacement
      # for a real secret scanner: it reads the working tree, not the history.
      - name: Validate repository hygiene
        run: npm run validate:repo-hygiene

      - name: Validate lifecycle email templates
        run: npm run validate:email-templates

      # Its own step, not folded into validate:locales: this guard covers the
      # Conversation Guide corpus (the app's largest block of user-facing
      # English, which check-store-metadata deliberately does not scan) AND the
      # two structural promises of its screen — no PremiumGate wrapper, and no
      # preview spent at mount. A failure here should name itself in the UI.
      - name: Validate Conversation Guide content and gating
        run: npm run validate:coach-content

      - name: Validate mobile retention guards
        run: npm run validate:retention-guards

      # The web half of the same retention work: profiles.email on
      # client-created rows, the relaxed required-field set, no invented
      # ascendant, the chart reveal before /app, and profiles.last_active.
      # Every one of these is one line to undo and silent when broken.
      - name: Validate web onboarding guards
        run: npm run validate:web-onboarding

      # The column list a client selects from discoverable_profiles is a string
      # on one side and DDL on the other, and nothing else in this pipeline
      # reads both. When they drifted on 23 May 2026, opening a profile answered
      # 400 on both platforms for three months while Discover kept working.
      - name: Validate profile read contract
        run: npm run validate:profile-reads

      # The 78-card deck lived twice until 2 Sep 2026 and the two copies had
      # already drifted apart in prose. This guards the single corpus, its
      # reflective voice in both written languages, and the fact that neither
      # app has grown a private deck back.
      - name: Validate tarot corpus and voice
        run: npm run validate:tarot-content

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test --if-present
