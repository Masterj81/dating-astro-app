name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.18+ is a hard requirement, not a preference:
          # scripts/validate-email-templates.mjs imports the edge-function
          # templates as TypeScript and asserts on the rendered output.
          # Native type stripping is on by default from 22.18 and absent
          # entirely on 20, where the run dies with "Unknown file extension".
          #
          # 24 also matches the machine this is developed on. CI was pinned to
          # 20 — past end-of-life — so it had been validating under a runtime
          # nobody actually runs.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate locales
        run: npm run validate:locales

      - name: Validate premium gating contract
        run: npm run validate:premium-gating

      - name: Validate lifecycle email templates
        run: npm run validate:email-templates

      # Its own step, not folded into validate:locales: this guard covers the
      # Conversation Guide corpus (the app's largest block of user-facing
      # English, which check-store-metadata deliberately does not scan) AND the
      # two structural promises of its screen — no PremiumGate wrapper, and no
      # preview spent at mount. A failure here should name itself in the UI.
      - name: Validate Conversation Guide content and gating
        run: npm run validate:coach-content

      - name: Validate mobile retention guards
        run: npm run validate:retention-guards

      # The web half of the same retention work: profiles.email on
      # client-created rows, the relaxed required-field set, no invented
      # ascendant, the chart reveal before /app, and profiles.last_active.
      # Every one of these is one line to undo and silent when broken.
      - name: Validate web onboarding guards
        run: npm run validate:web-onboarding

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test --if-present
