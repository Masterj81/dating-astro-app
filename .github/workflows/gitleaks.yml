name: Secret Scan (Gitleaks)

# JUNO-18 — vrai scanner de secrets (Gitleaks, règles maintenues), en workflow
# SÉPARÉ de Quality Gates : périmètre et durée indépendants, et ce workflow ne
# touche aucun secret — le dépôt est public, l'action officielle gitleaks ne
# nécessite ni licence ni token au-delà de celui, lecture seule, injecté par
# GitHub (les PR de forks n'en reçoivent qu'un read-only ; rien à divulguer).
#
# fetch-depth: 0 — l'historique complet est la vraie garantie (un secret
# committé puis supprimé reste détectable). Coût mesuré : dépôt ~50 Mo de
# texte, le scan historique prend ~1 min.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
