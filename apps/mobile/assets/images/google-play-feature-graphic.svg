    <rect x="0.5" y="0.5" width="297" height="43" rx="21.5" stroke="#e9c873" stroke-opacity="0.32"/>
    <text x="24" y="29" fill="#e9c873" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.26em">SYNASTRY GUIDE</text>

    <text x="-3" y="186" fill="#f3f4f7" font-family="Segoe UI, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="0.06em">JUNO</text>

    <text x="2" y="246" fill="#e7e9ee" fill-opacity="0.82" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">Explore connection through synastry.</text>
    <text x="2" y="284" fill="#e7e9ee" fill-opacity="0.56" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Birth-chart context before the conversation.</text>
  </g>

