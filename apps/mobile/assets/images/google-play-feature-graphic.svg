    <circle cx="206" cy="132" r="1.1" opacity="0.4"/>
    <circle cx="322" cy="92" r="1.4" opacity="0.5"/>
    <circle cx="120" cy="404" r="1.2" opacity="0.42"/>
    <circle cx="262" cy="436" r="1.5" opacity="0.5"/>
    <circle cx="700" cy="84" r="1.3" opacity="0.45"/>
    <circle cx="894" cy="124" r="1.6" opacity="0.5"/>
    <circle cx="838" cy="402" r="1.2" opacity="0.4"/>
  </g>

  <!-- left: eyebrow + JUNO wordmark + tagline -->
  <g transform="translate(86 128)">
