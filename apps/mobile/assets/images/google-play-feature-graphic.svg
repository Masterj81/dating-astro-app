      <stop offset="0.55" stop-color="#0c0e13"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(812 250) rotate(140) scale(250 180)">
      <stop stop-color="#e9c873" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e9c873" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 96) rotate(40) scale(230 160)">
