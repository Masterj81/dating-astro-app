  <rect width="1024" height="500" fill="#08090b"/>
  <rect x="28" y="22" width="968" height="456" rx="34" fill="url(#bg)"/>
  <rect x="28" y="22" width="968" height="456" rx="34" fill="url(#goldGlow)"/>
  <rect x="28" y="22" width="968" height="456" rx="34" fill="url(#blueGlow)"/>
  <rect x="28.5" y="22.5" width="967" height="455" rx="33.5" stroke="#e7e9ee" stroke-opacity="0.08"/>

  <g fill="#e7e9ee">
