<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- JUNO Google Play feature graphic, detailed variant.
       (Filename retained for tooling continuity; content is JUNO.) -->
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="980" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11141b"/>
      <stop offset="0.5" stop-color="#0c0e13"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 86) rotate(140) scale(280 200)">
      <stop stop-color="#e9c873" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e9c873" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 90) rotate(40) scale(260 170)">
      <stop stop-color="#7aa7ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7aa7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f4f7"/>
      <stop offset="1" stop-color="#cdd0d9"/>
    </linearGradient>
    <radialGradient id="ptGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9c873" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e9c873" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pt" cx="0.42" cy="0.38" r="0.78">
      <stop offset="0" stop-color="#fbf0cf"/>
      <stop offset="0.55" stop-color="#ecce7e"/>
      <stop offset="1" stop-color="#d9b25b"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a23"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e7e9ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e7e9ee" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="#08090b"/>
  <rect x="24" y="20" width="976" height="460" rx="34" fill="url(#bg)"/>
  <rect x="24" y="20" width="976" height="460" rx="34" fill="url(#goldGlow)"/>
  <rect x="24" y="20" width="976" height="460" rx="34" fill="url(#blueGlow)"/>
  <rect x="24.5" y="20.5" width="975" height="459" rx="33.5" stroke="#e7e9ee" stroke-opacity="0.08"/>

  <g fill="#e7e9ee">
    <circle cx="120" cy="74" r="1.5" opacity="0.5"/>
    <circle cx="214" cy="118" r="1.1" opacity="0.38"/>
    <circle cx="624" cy="70" r="1.2" opacity="0.42"/>
    <circle cx="906" cy="372" r="1.3" opacity="0.42"/>
  </g>

  <!-- header: wordmark + tagline (left), JUNO mark tile (right) -->
  <g transform="translate(80 70)">
    <text x="0" y="74" fill="#f3f4f7" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="0.06em">JUNO</text>
    <text x="2" y="120" fill="#e7e9ee" fill-opacity="0.78" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Explore connection through synastry.</text>
    <text x="2" y="156" fill="#e7e9ee" fill-opacity="0.54" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">Review birth-chart context before the conversation.</text>
  </g>

  <g transform="translate(806 56)">
    <rect x="0" y="0" width="148" height="148" rx="34" fill="url(#tile)"/>
    <rect x="0.5" y="0.5" width="147" height="147" rx="33.5" stroke="#e9c873" stroke-opacity="0.18"/>
    <g transform="translate(74 74) scale(0.20)">
      <circle r="120" fill="url(#ptGlow)"/>
      <circle cx="-92" cy="0" r="170" fill="none" stroke="url(#ring)" stroke-width="34"/>
      <circle cx="92" cy="0" r="170" fill="none" stroke="url(#ring)" stroke-width="34"/>
      <path d="M 92 -170 A 170 170 0 0 1 262 0 A 170 170 0 0 1 92 170" fill="none" stroke="url(#ring)" stroke-width="34"/>
      <path d="M -3 -142 A 170 170 0 0 0 -3 142" fill="none" stroke="url(#ring)" stroke-width="34"/>
      <circle r="31" fill="url(#pt)"/>
      <circle r="11" fill="#fdf6e0"/>
    </g>
  </g>

  <!-- three context cards -->
  <g transform="translate(80 270)">
    <rect x="0" y="0" width="276" height="158" rx="26" fill="url(#card)"/>
    <rect x="0.5" y="0.5" width="275" height="157" rx="25.5" stroke="#e7e9ee" stroke-opacity="0.08"/>
    <circle cx="50" cy="52" r="22" fill="#7aa7ff" fill-opacity="0.14"/>
    <circle cx="50" cy="52" r="13" fill="none" stroke="#9bbcff" stroke-width="2.4"/>
    <circle cx="50" cy="52" r="2.6" fill="#9bbcff"/>
    <text x="88" y="46" fill="#f3f4f7" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Chart context</text>
    <text x="88" y="74" fill="#e7e9ee" fill-opacity="0.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500">Sun, Moon and Rising</text>
    <text x="88" y="95" fill="#e7e9ee" fill-opacity="0.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500">at a glance</text>
    <text x="24" y="134" fill="#e7e9ee" fill-opacity="0.42" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">A profile with real context</text>
  </g>

  <g transform="translate(374 270)">
    <rect x="0" y="0" width="276" height="158" rx="26" fill="url(#card)"/>
    <rect x="0.5" y="0.5" width="275" height="157" rx="25.5" stroke="#e7e9ee" stroke-opacity="0.08"/>
    <circle cx="50" cy="52" r="22" fill="#e9c873" fill-opacity="0.13"/>
    <circle cx="44" cy="52" r="11" fill="none" stroke="#ecce7e" stroke-width="2.4"/>
    <circle cx="56" cy="52" r="11" fill="none" stroke="#ecce7e" stroke-width="2.4"/>
    <text x="88" y="46" fill="#f3f4f7" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Synastry insight</text>
    <text x="88" y="74" fill="#e7e9ee" fill-opacity="0.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500">Two birth charts,</text>
    <text x="88" y="95" fill="#e7e9ee" fill-opacity="0.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500">read together</text>
    <text x="24" y="134" fill="#e7e9ee" fill-opacity="0.42" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">See the connection first</text>
  </g>

  <g transform="translate(668 270)">
    <rect x="0" y="0" width="276" height="158" rx="26" fill="url(#card)"/>
    <rect x="0.5" y="0.5" width="275" height="157" rx="25.5" stroke="#e7e9ee" stroke-opacity="0.08"/>
    <circle cx="50" cy="52" r="22" fill="#7aa7ff" fill-opacity="0.14"/>
    <path d="M40 62 C40 50 46 44 52 44 C58 44 62 49 60 56" fill="none" stroke="#9bbcff" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="3" fill="#9bbcff"/>
    <text x="88" y="46" fill="#f3f4f7" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Guided intros</text>
    <text x="88" y="74" fill="#e7e9ee" fill-opacity="0.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500">Openers shaped by</text>
    <text x="88" y="95" fill="#e7e9ee" fill-opacity="0.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="500">your charts</text>
    <text x="24" y="134" fill="#e7e9ee" fill-opacity="0.42" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">Start an intentional conversation</text>
  </g>
</svg>
