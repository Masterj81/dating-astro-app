<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 26% 20%, rgba(233, 200, 115, 0.14), transparent 42%),
        radial-gradient(circle at 84% 82%, rgba(122, 167, 255, 0.12), transparent 46%),
        linear-gradient(150deg, #11141b 0%, #0c0e13 52%, #08090b 100%);
      color: #e7e9ee;
      position: relative;
    }
    .frame {
      position: absolute;
      inset: 36px;
      border-radius: 34px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012));
      border: 1px solid rgba(231, 233, 238, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      background-image:
        radial-gradient(1.8px 1.8px at 14% 22%, rgba(231, 233, 238, 0.7), transparent),
        radial-gradient(1.4px 1.4px at 30% 70%, rgba(231, 233, 238, 0.45), transparent),
        radial-gradient(1.8px 1.8px at 58% 16%, rgba(231, 233, 238, 0.55), transparent),
        radial-gradient(1.4px 1.4px at 88% 60%, rgba(231, 233, 238, 0.4), transparent),
        radial-gradient(1.6px 1.6px at 72% 84%, rgba(231, 233, 238, 0.5), transparent);
      opacity: 0.6;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
      padding: 60px 78px;
    }
    .copy {
      max-width: 600px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid rgba(233, 200, 115, 0.34);
      background: rgba(233, 200, 115, 0.07);
      color: #e9c873;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .title {
      font-size: 122px;
      line-height: 0.92;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 24px;
      color: #f3f4f7;
    }
    .subtitle {
      font-size: 29px;
      line-height: 1.42;
      color: rgba(231, 233, 238, 0.74);
      max-width: 540px;
    }
    .mark-wrap {
      width: 300px;
      height: 300px;
      flex-shrink: 0;
      border-radius: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 34%, #161a23 0%, #0d0f15 62%, #08090b 100%);
      border: 1px solid rgba(233, 200, 115, 0.16);
      box-shadow:
        0 30px 90px rgba(5, 6, 11, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .logo {
      width: 300px;
      height: 300px;
    }
    .foot {
      position: absolute;
      left: 78px;
      right: 78px;
      bottom: 46px;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(231, 233, 238, 0.40);
      font-size: 17px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="content">
    <div class="copy">
      <div class="eyebrow">Synastry Guide</div>
      <h1 class="title">JUNO</h1>
      <p class="subtitle">Explore connection through synastry — birth-chart context before the conversation.</p>
    </div>

    <div class="mark-wrap">
      <!-- JUNO mark: two interlocking synastry rings with a luminous
           gold intersection point (icon direction E). -->
      <svg class="logo" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="ogRing" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f3f4f7"/>
            <stop offset="1" stop-color="#cdd0d9"/>
          </linearGradient>
          <radialGradient id="ogGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#e9c873" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#e9c873" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="ogPoint" cx="0.42" cy="0.38" r="0.78">
            <stop offset="0" stop-color="#fbf0cf"/>
            <stop offset="0.55" stop-color="#ecce7e"/>
            <stop offset="1" stop-color="#d9b25b"/>
          </radialGradient>
        </defs>
        <g transform="translate(512 512)">
          <circle r="120" fill="url(#ogGlow)"/>
          <circle cx="-92" cy="0" r="170" fill="none" stroke="url(#ogRing)" stroke-width="34"/>
          <circle cx="92" cy="0" r="170" fill="none" stroke="url(#ogRing)" stroke-width="34"/>
          <path d="M 92 -170 A 170 170 0 0 1 262 0 A 170 170 0 0 1 92 170"
                fill="none" stroke="url(#ogRing)" stroke-width="34"/>
          <path d="M -3 -142 A 170 170 0 0 0 -3 142"
                fill="none" stroke="url(#ogRing)" stroke-width="34"/>
          <circle r="31" fill="url(#ogPoint)"/>
          <circle r="11" fill="#fdf6e0"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="foot">
    <span>Synastry-led relationship discovery</span>
    <span>junosynastry.com</span>
  </div>
</body>
</html>
